[project]
name = "notifyi-display"
version = "0.1.0"
description = "카메라 자세 판독 결과를 디스플레이 표정으로 보여주는 앱"
requires-python = ">=3.10"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
